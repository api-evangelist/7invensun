aid: 7invensun
name: 7Invensun Technology
description: >-
  7Invensun Technology (Beijing 7invensun Technology Co., Ltd. / 北京七鑫易维信息技术有限公司) is a
  Beijing-based eye-tracking company founded in 2009 that develops eye-tracking hardware,
  gaze-estimation algorithms and device SDKs. Its aSee product family spans glasses-style,
  desktop and high-speed research eye trackers (aSee Glasses, aSee Glasses Elite, aSee Pro,
  aSee Pro Plus, aSee A series), aSee VR modules embedded in XR headsets, an aSee Mobile
  developer accessory, and eye-controlled communication aids for people with ALS, high
  paraplegia and cerebral palsy. The company packages these into solutions for in-vehicle
  driver monitoring (DMS), spatial computing and XR foveated rendering, phone and tablet
  gaze interaction, and safety monitoring, and states it serves more than 1,000 customers
  across research and education, healthcare, energy, transport and aerospace. Its developer
  surface is a native device SDK distributed from its own download center and through OEM
  agreements, not a public web API.
